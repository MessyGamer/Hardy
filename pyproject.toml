[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atak-bridge"
version = "0.1.0"
description = "ATAK / TAK server bridge for a MAVLink fixed-wing UAV, for a Raspberry Pi ground station"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pymavlink>=2.4.40", "cryptography>=38"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
atak-bridge = "atak_bridge.app:main"

[tool.setuptools]
packages = ["atak_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
